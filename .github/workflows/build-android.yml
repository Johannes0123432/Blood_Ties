name: Export Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & Tools
        run: |
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

          mkdir -p $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          rm cmdline-tools.zip

          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Download Godot 4.3 & Export Templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot

          mkdir -p ~/.local/share/godot/export_templates/4.3.stable/
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q Godot_v4.3-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/4.3.stable/
          rm -rf templates

      - name: Generate Keystore & Write Export Preset
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          # Generate a signing keystore so Godot's export validator passes
          keytool -genkey -v \
            -keystore blood-ties-release.keystore \
            -alias "$KEYSTORE_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            -dname "CN=Johannes Sikoka, OU=Development, O=BloodTies, L=Rundu, C=NA"

          # Create a fully compliant Godot 4.3 export preset configuration
          cat <<EOF > export_presets.cfg
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/BloodTies-debug.apk"
          patch_export_binaries=0
          script_export_mode=1
          script_encryption_key=""

          [preset.0.options]
          custom_build/use_custom_build=false
          architectures/armeabi-v7a=true
          architectures/arm64-v8a=true
          application/id="com.johannessikoka.bloodties"
          application/name="Blood Ties"
          package/signed=true
          keystore/release="res://blood-ties-release.keystore"
          keystore/release_user="$KEYSTORE_ALIAS"
          keystore/release_password="$KEYSTORE_PASSWORD"
          EOF

      - name: Configure Godot Editor Settings for Android SDK & Tools
        run: |
          mkdir -p ~/.config/godot
          cat <<EOF > ~/.config/godot/editor_settings-4.3.tres
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$HOME/android-sdk"
          export/android/apksigner_path = "$HOME/android-sdk/build-tools/34.0.0/apksigner"
          export/android/adb_path = "$HOME/android-sdk/platform-tools/adb"
          export/android/debug_keystore = "res://blood-ties-release.keystore"
          export/android/debug_keystore_user = "$KEYSTORE_ALIAS"
          export/android/debug_keystore_pass = "$KEYSTORE_PASSWORD"
          EOF

      - name: Build APK
        run: |
          mkdir -p build
          godot --path . --headless --export-debug "Android" build/BloodTies-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BloodTies-debug-apk
          path: build/BloodTies-debug.apk
