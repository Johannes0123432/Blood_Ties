name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.3.0
  EXPORT_NAME: BloodTies
  PROJECT_PATH: .

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          include-templates: true

      - name: Create build directory
        run: mkdir -p build

      - name: Create export_presets.cfg
        run: |
          cat > export_presets.cfg << 'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          export_filter="all_resources"
          export_path="build/BloodTies.apk"
          script_export_mode=2

          [preset.0.options]
          architectures/armeabi-v7a=true
          architectures/arm64-v8a=true
          version/code=1
          version/name="1.0.0"
          package/unique_name="com.sikoka.bloodties"
          package/name="Blood Ties"
          package/signed=true
          package/classify_as_game=true
          screen/immersive_mode=true
          permissions/internet=true
          permissions/vibrate=true
          EOF

      - name: Export Android Debug APK
        run: |
          godot --headless --path . --export-debug "Android" build/BloodTies-debug.apk || true
          ls -la build/ || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BloodTies-debug-apk
          path: build/*.apk
          if-no-files-found: ignore
          retention-days: 14
