name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Godot APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3-stable
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Export Directories
        run: |
          mkdir -p build/android

      - name: Download Android Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable/
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q Godot_v4.3-stable_export_templates.tpz -d ~/.local/share/godot/export_templates/
          mv ~/.local/share/godot/export_templates/templates/* ~/.local/share/godot/export_templates/4.3.stable/

      - name: Build Debug APK
        run: |
          godot --headless --export-debug "Android" build/android/BloodTies-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BloodTies-debug-apk
          path: build/android/BloodTies-debug.apk
